<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <!-- SPDX-FileCopyrightText: Copyright 2026 After Hours Arcade Manager Project -->
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- README banner: the app icon beside the name, in the library's colours. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c9ff"/>
      <stop offset="0.5" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#5b3fc4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5b0ff"/>
      <stop offset="1" stop-color="#d8f077"/>
    </linearGradient>
    <radialGradient id="glowLavender" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a98bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a98bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8f077" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d8f077" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="28" fill="#101115"/>
  <g clip-path="url(#round)"><ellipse cx="230" cy="40" rx="520" ry="320" fill="url(#glowLavender)"/>
  <ellipse cx="1180" cy="360" rx="560" ry="340" fill="url(#glowLime)"/></g>

  <!-- A few game cards fanned out on the right, like the library grid -->
  <g opacity="0.9">
    <g transform="translate(1100 92) rotate(8) scale(0.8)">
      <rect width="150" height="200" rx="16" fill="#1c1d26" stroke="#2e3040" stroke-width="2"/>
      <rect x="12" y="12" width="126" height="120" rx="10" fill="#5b3fc4" opacity="0.55"/>
      <rect x="12" y="146" width="96" height="12" rx="6" fill="#3a3c4e"/>
      <rect x="12" y="168" width="60" height="20" rx="10" fill="#d8f077"/>
    </g>
    <g transform="translate(1010 100) rotate(-4) scale(0.8)">
      <rect width="150" height="200" rx="16" fill="#1c1d26" stroke="#2e3040" stroke-width="2"/>
      <rect x="12" y="12" width="126" height="120" rx="10" fill="#a98bff" opacity="0.6"/>
      <rect x="12" y="146" width="110" height="12" rx="6" fill="#3a3c4e"/>
      <rect x="12" y="168" width="60" height="20" rx="10" fill="#d8f077"/>
    </g>
  </g>

  <!-- The app icon (dist/afterhours.svg) -->
  <g transform="translate(84 52)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
    <rect x="8" y="8" width="240" height="120" rx="56" fill="#ffffff" opacity="0.12"/>
    <circle cx="128" cy="128" r="78" fill="#101115"/>
    <path d="M110 90 Q 104 86, 104 94 L 104 162 Q 104 170, 111 166 L 168 133 Q 175 128, 168 123 Z"
          fill="#c5b0ff"/>
    <circle cx="186" cy="74" r="20" fill="#d8f077" stroke="#101115" stroke-width="8"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="400" y="170" font-size="84" font-weight="800" fill="#f2f0fa"
          letter-spacing="-1">After Hours</text>
    <rect x="404" y="196" width="180" height="6" rx="3" fill="url(#accent)"/>
    <text x="404" y="252" font-size="30" fill="#b7b2c9">Every console's games, in one library</text>
  </g>
</svg>

# After Hours metadata API (pretendulator-api) on port 80. Images already kept on disk are
# served directly; everything else goes to the service on 127.0.0.1:8090.
limit_req_zone $binary_remote_addr zone=pretendulator_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pretendulator_img:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/pretendulator-api.access.log;
    client_max_body_size 1k;

    location /v1/ {
        limit_req zone=pretendulator_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /img/ {
        limit_req zone=pretendulator_img burst=100 nodelay;
        limit_req_status 429;
        root /var/lib/pretendulator-api;
        try_files $uri @fetch_image;
        expires 30d;
    }

    location @fetch_image {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        return 404;
    }
}
